name: Deploy

# Tests every push to main, then deploys to Cloud Run once the repository
# variables described in the README are set. Until then the deploy job is skipped.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    if: vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: timewise
          region: ${{ vars.GCP_REGION || 'us-central1' }}
          source: .
          flags: --allow-unauthenticated
          env_vars: |
            TIMEWISE_DATABASE=bigquery
            TIMEWISE_BIGQUERY_PROJECT=${{ vars.GCP_PROJECT_ID }}
            TIMEWISE_COOKIE_SECRET=${{ secrets.TIMEWISE_COOKIE_SECRET }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
      - name: Show service URL
        run: echo "Deployed to ${{ steps.deploy.outputs.url }}"
